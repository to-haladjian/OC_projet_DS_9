# Full demo stack: FastAPI (8000) + Dash chat UI (8050), both from the same image.
# Prerequisite: a .env file at the repo root with MISTRAL_API_KEY (cf. .env.example).
# First start builds the FAISS index into the mounted ./faiss_index volume (slower);
# later starts reuse it.

services:
  api:
    build: .
    image: rag-evenements-idf
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Build the index on first start if the mounted volume is empty.
      BUILD_INDEX_IF_MISSING: "1"
    volumes:
      - ./data:/app/data
      - ./faiss_index:/app/faiss_index
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      # Generous grace period: the first start may build the whole index.
      start_period: 600s
    restart: unless-stopped

  ui:
    # Reuses the image built by the api service.
    image: rag-evenements-idf
    command: ["python", "interface/dash_app.py"]
    ports:
      - "8050:8050"
    environment:
      RAG_API_URL: "http://api:8000"
      DASH_HOST: "0.0.0.0"
      DASH_DEBUG: "0"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
