[project]
name = "projet9"
version = "0.1.0"
description = ""
authors = [
    {name = "Thomas-Oshagan Haladjian",email = "thomas.haladjian@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0.0"
dependencies = [
    "langchain (>=1.3.2,<2.0.0)",
    "faiss-cpu (>=1.14.2,<2.0.0)",
    "langchain-community (>=0.4.2,<0.5.0)",
    "langchain-huggingface (>=1.2.2,<2.0.0)",
    "langchain-mistralai (>=1.1.4,<2.0.0)",
    "pandas (>=3.0.3,<4.0.0)",
    "mistralai (>=1.9.0,<2.0.0)",
    "matplotlib (>=3.10.9,<4.0.0)",
    "numpy (>=2.4.6,<3.0.0)",
    "requests (>=2.32.0,<3.0.0)",
    "beautifulsoup4 (>=4.14.0,<5.0.0)",
    "python-dotenv (>=1.2.0,<2.0.0)",
    "fastapi (>=0.120.0,<1.0.0)",
    "uvicorn[standard] (>=0.38.0,<1.0.0)",
    "dash (>=3.0.0,<4.0.0)",
]


[tool.poetry]
# Use Poetry for dependency management only: this is an application (run via the
# scripts/ entrypoints), not an importable library, so there is no package to install.
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.2.0,<8.0.0)",
    "jupyterlab (>=4.5.7,<5.0.0)",
    "pytest (>=9.0.0,<10.0.0)",
    "httpx (>=0.28.0,<1.0.0)",
    "ragas (>=0.4.3,<0.5.0)",
    "datasets (>=5.0.0,<6.0.0)",
    "rapidfuzz (>=3.14.5,<4.0.0)"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
