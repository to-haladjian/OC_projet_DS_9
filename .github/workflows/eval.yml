name: RAG evaluation (Ragas)

# Manual trigger only: each run makes Mistral calls (judge + embeddings), so we don't run
# it on every push. It can be extended to e.g. pull_request with a label if desired.
on:
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install

      - name: Run Ragas evaluation
        env:
          # Provide this as a repository secret: Settings → Secrets → Actions.
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        # Builds a small index from the committed evaluation/corpus.csv, runs the RAG chain
        # over evaluation/testset.json, scores with Ragas and gates on the thresholds.
        run: poetry run python scripts/evaluate_rag.py --fail-under

      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ragas-results
          path: evaluation/results/
          if-no-files-found: ignore
